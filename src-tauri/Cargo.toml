[package]
name = "rustycord"
version = "0.12.2"
description = "RustyCord — an unofficial Discord client built with Tauri, reverse-engineered architecture, native performance"
authors = ["RustyCord contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/VinylRUS/Rustycord"
homepage = "https://github.com/VinylRUS/Rustycord"
keywords = ["discord", "tauri", "svelte", "client", "reverse-engineering"]
categories = ["gui", "network-programming"]
exclude = ["/target", "/gen"]

# Протокол Discord живёт в `crates/rustycord-core` и shared с GPUI-фронтендом
# (`app-gpui`). Здесь — только Tauri-обвязка: IPC-команды, окно капчи,
# автообновления, файловые диалоги.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and the name of the lib crate cannot be the
# same as the binary that links to it (the compiler would error out).
name = "rustycord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rustycord-core = { path = "../crates/rustycord-core" }
tauri = { version = "2", features = [] }
# Диалог выбора файлов (загрузка вложений) и открытие внешних ссылок
# (страница релиза при проверке обновлений).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Автообновления: подписанный манифест latest.json (updater) и перезапуск
# приложения после установки (process::restart).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IPC-команды живут на токио-рантайме Tauri: tokio::spawn/fs/time/sync.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
# Объект-безопасный CaptchaSolver для TauriCaptcha.
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Суточные файлы логов в app_log_dir — без консоли релизная сборка
# иначе не diagnosируемая (баг «gateway отваливается» без логов не поймать).
tracing-appender = "0.2"

# Примечание: в Tauri 2 фича `tauri/custom-protocol` (встраивание ассетов фронтенда в
# бинарник) включается самим CLI при `tauri build` — отдельный passthrough здесь не нужен.

[build-dependencies]
tauri-build = { version = "2", features = [] }
