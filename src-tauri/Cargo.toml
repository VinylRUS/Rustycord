[package]
name = "rustycord"
version = "0.8.2"
description = "RustyCord — an unofficial Discord client built with Tauri, reverse-engineered architecture, native performance"
authors = ["RustyCord contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/VinylRUS/Rustycord"
homepage = "https://github.com/VinylRUS/Rustycord"
keywords = ["discord", "tauri", "svelte", "client", "reverse-engineering"]
categories = ["gui", "network-programming"]
exclude = ["/target", "/gen"]

# См. больше ключей и их значений: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and the name of the lib crate cannot be the
# same as the binary that links to it (the compiler would error out).
name = "rustycord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `audio` — работа с системными аудиоустройствами (cpal: WASAPI/CoreAudio/ALSA).
# Сборка с --no-default-features даёт «headless»-вариант: сигналинг и
# голосовой движок songbird работают, но звук не выводится и не пишется —
# удобно для серверов и проверки логики без устройств.
default = ["audio"]
audio = ["dep:cpal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Диалог выбора файлов (загрузка вложений) и открытие внешних ссылок
# (страница релиза при проверке обновлений).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart", "cookies"] }
futures-util = "0.3"
# async_trait — нужен для impl AsyncMediaSource (songbird) и EventHandler.
async-trait = "0.1"
# User-auth: QR remote-auth (RSA-OAEP-SHA256), /auth/login.
# OsRng берём из реэкспорта rsa (rsa::rand_core) — прямая зависимость
# rand не нужна и регулярно ломалась major-бампами dependabot'а.
# sha2 держим на 0.10: 0.11 перешёл на digest 0.11-трейты, с которыми
# rsa 0.9 несовместим (rsa ждёт digest 0.10). hmac удалён — протокол
# remote-auth v2 proof-эхом (nonce_proof) больше HMAC не использует.
rsa = "0.9"
sha2 = "0.10"
base64 = "0.23"
# QR-матрица для remote-auth (SVG собираем сами — без тяжёлых зависимостей).
qrcode = { version = "0.14", default-features = false }
# Голосовой движок: songbird (драйвер Discord voice v4/v5: современное
# шифрование aead_aes256_gcm / xchacha20, jitter-буфер, opus, микшер).
# «driver» — сам движок, «receive» — декодирование входящего аудио
# (CoreEvent::VoiceTick), «gateway» — зависимости менеджера (нужен
# receive-модулю: dashmap для ssrc-трекера), «tungstenite»+«rustls» —
# WS-бэкенд к медиасерверу.
songbird = { version = "0.6", default-features = false, features = ["driver", "receive", "gateway", "tungstenite", "rustls"] }
# Аудиоустройства — только с фичей `audio` (см. [features]).
cpal = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Суточные файлы логов в app_log_dir — без консоли релизная сборка
# иначе не diagnosируемая (баг «gateway отваливается» без логов не поймать).
tracing-appender = "0.2"

# Примечание: в Tauri 2 фича `tauri/custom-protocol` (встраивание ассетов фронтенда в
# бинарник) включается самим CLI при `tauri build` — отдельный passthrough здесь не нужен.

[profile.release]
# Меньше и быстрее релизный бинарник — уместно для клиента, заменяющего 200-мегабайтный Electron.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
