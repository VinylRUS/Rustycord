[package]
name = "rustycord-gpui"
version = "0.11.0"
description = "RustyCord GPUI — нативный Discord-клиент на GPUI (Zed), общий протокол с Tauri-версией через rustycord-core"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/VinylRUS/Rustycord"

[[bin]]
name = "rustycord-gpui"
path = "src/main.rs"

[features]
default = ["audio", "captcha-webview", "file-dialogs"]
# Голосовые аудиоустройства (cpal: WASAPI/CoreAudio/ALSA). Без фичи —
# headless-сборка для CI-проверки без libasound2-dev.
audio = ["rustycord-core/audio"]
# Окна webview (standalone wry + winit): капча hCaptcha/Turnstile и
# локальное превью «Показать экран»/«Камера» (getDisplayMedia/getUserMedia,
# как в Tauri-версии). Linux требует webkit2gtk-4.1, Windows — WebView2,
# macOS — WKWebView (нужен главный поток — превью/капча недоступны).
# Без фичи: вход email с капчей отдаёт понятную ошибку (токен/QR работают),
# Go Live/камера — только сигналинг без превью.
captcha-webview = ["dep:wry", "dep:winit"]
# Нативный файловый диалог (вложения в сообщениях). Linux-бэкенд —
# xdg-desktop-portal (pure Rust, без gtk-девелоперских зависимостей).
file-dialogs = ["dep:rfd"]

[dependencies]
rustycord-core = { path = "../crates/rustycord-core", default-features = false }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# QR-матрица (renderим модулями div — без ассетов).
qrcode = { version = "0.14", default-features = false }
# Курсор-графемика для текстовых полей (как в примере gpui).
unicode-segmentation = "1"
# HTTP-клиент gpui (аватарки/эмодзи через img()) на reqwest.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# Окно капчи/превью: standalone wry + winit (EventLoop в отдельном потоке).
wry = { version = "0.57", optional = true }
winit = { version = "0.30", optional = true, features = ["rwh_06"] }
# Файловый диалог для вложений: Windows/macOS — нативный, Linux —
# xdg-desktop-portal (не тянет gtk в headless-сборку CI).
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal"] }
