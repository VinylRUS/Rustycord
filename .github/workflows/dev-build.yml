name: Dev Build

# Автосборка «ночных» артефактов на каждый пуш в main.
# Ничего не публикует — только выкладывает установщики как artifacts воркфлоу.
# Для релиза используйте release.yml (push тега v*).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Vendored-opus у audiopus_sys (macOS/Windows собирает libopus через cmake)
  # имеет доисторический CMakeLists (< 3.5), с которым несовместим CMake >= 4
  # на раннерах. Эта переменная возвращает совместимость (CMake 4.0+).
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # универсальный бинарник: aarch64 + x86_64
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev libopus-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Как в release.yml: без секрета TAURI_SIGNING_PRIVATE_KEY tauri build
      # падает («A public key has been found, but no private key») —
      # собираем без апдейтер-артефактов. Добавь секрет — и dev-сборки
      # станут подписанными автоматически.
      - name: Build RustyCord
        shell: bash   # windows-latest по умолчанию PowerShell
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS='${{ matrix.args }}'
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            npx tauri build $ARGS
          else
            echo '::warning::Секрета TAURI_SIGNING_PRIVATE_KEY нет — собираем без апдейтер-артефактов (createUpdaterArtifacts=false)'
            npx tauri build $ARGS --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: rustycord-dev-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
