name: CI

# Быстрые проверки на каждый push / PR:
#   frontend — svelte-check + production-сборка Vite
#   rustfmt  — форматирование (не требует системных библиотек)
#   rust     — clippy (3 платформы) + cargo test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Vendored-opus у audiopus_sys (macOS/Windows собирает libopus через cmake)
  # имеет доисторический CMakeLists (< 3.5), с которым несовместим CMake >= 4
  # на раннерах. Эта переменная возвращает совместимость (CMake 4.0+).
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  frontend:
    name: Frontend (Svelte 5 + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Production build
        run: npm run build

  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # cargo fmt ничего не компилирует — системные зависимости не нужны
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

  rust:
    name: Rust ${{ matrix.platform }} (clippy + tests)
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev libopus-dev cmake

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci
        # tauri-build запускается сборкой фронтенда — зависимостей требует мало,
        # но держим окружение идентичным релизному

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri
