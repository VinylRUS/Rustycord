name: CI

# Быстрые проверки на каждый push / PR:
#   frontend — svelte-check + production-сборка Vite
#   rustfmt  — форматирование (не требует системных библиотек)
#   rust     — clippy (3 платформы) + cargo test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Vendored-opus у audiopus_sys (macOS/Windows собирает libopus через cmake)
  # имеет доисторический CMakeLists (< 3.5), с которым несовместим CMake >= 4
  # на раннерах. Эта переменная возвращает совместимость (CMake 4.0+).
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  frontend:
    name: Frontend (Svelte 5 + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Production build
        run: npm run build

  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # cargo fmt ничего не компилирует — системные зависимости не нужны
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

  rust:
    name: Rust ${{ matrix.platform }} (clippy + tests)
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev libopus-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: npm ci
        # tauri-build запускается сборкой фронтенда — зависимостей требует мало,
        # но держим окружение идентичным релизному

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

  # ─────────────────────────────────────────────────────────────────────────
  # GPUI-фронтенд (app-gpui): headless-проверка без системных библиотек
  # (--no-default-features выключает cpal/wry) — тот же режим, что и локально.
  # ─────────────────────────────────────────────────────────────────────────
  gpui:
    name: GPUI ${{ matrix.platform }} (clippy + tests)
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: gpui

      # libc 0.2.189 пин в Cargo.lock обязателен: 0.2.190+ убрал ENOATTR
      # для linux-gnu — xattr 0.2.x (gpui → gpui_http_client → zed-async-tar)
      # не собирается (WGPUI #275). Проверяем, что пин не потерялся.
      - name: Verify libc pin (0.2.189)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          VER=$(grep -A1 'name = "libc"' Cargo.lock | grep version | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "libc = $VER"
          if [ "$VER" != "0.2.189" ]; then
            echo "::error::libc $VER сломает gpui на Linux (ENOATTR). Пиньте 0.2.189: cargo update -p libc --precise 0.2.189"
            exit 1
          fi

      - name: Clippy (deny warnings)
        run: cargo clippy -p rustycord-core -p rustycord-gpui --no-default-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p rustycord-core -p rustycord-gpui --no-default-features

  # GPUI с полным набором фич (audio + captcha-webview): путь wry/winit
  # компилируется только с системными библиотеками (webkit2gtk на Linux).
  gpui-full:
    name: GPUI full features (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libopus-dev cmake libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: gpui-full

      - name: Cargo check (default features — audio + captcha-webview)
        run: cargo check -p rustycord-gpui

