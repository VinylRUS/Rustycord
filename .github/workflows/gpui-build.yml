name: GPUI build

# Сборка нативных бинарников rustycord-gpui (без Tauri) — вручную или
# при изменениях app-gpui в main. Артефакты появляются в Actions →
# скачиваем и тестируем; в теговые релизы прикладываются отдельно.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-gpui/**'
      - 'crates/**'
      - 'Cargo.lock'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys (vendored opus) собирает libopus через cmake.
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustycord-gpui-linux-x64
            ext: tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustycord-gpui-windows-x64
            ext: zip
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: rustycord-gpui-macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libopus-dev cmake libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: gpui-build

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p rustycord-gpui

      - name: Package (Linux/macOS)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz rustycord-gpui

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/rustycord-gpui.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error
