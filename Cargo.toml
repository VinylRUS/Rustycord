[workspace]
resolver = "2"
members = [
    "crates/rustycord-core",
    "src-tauri",
    "app-gpui",
]

# Общие настройки релиза для всех членов workspace.
[workspace.package]
version = "0.12.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/VinylRUS/Rustycord"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# ВАЖНО: без panic = "abort"! С abort любая паника (в т.ч. в tokio-таске)
# мгновенно убивала процесс без единого сообщения — «вылетает без ошибок»
# (v0.12.1). Со unwind паники ловит panic-хук: трейс уходит в
# <config>/logs/rustycord.log, а паника в фоновой задаче больше не роняет
# весь клиент.
