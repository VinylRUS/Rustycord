[workspace]
resolver = "2"
members = [
    "crates/rustycord-core",
    "src-tauri",
    "app-gpui",
]

# Общие настройки релиза для всех членов workspace.
[workspace.package]
version = "0.12.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/VinylRUS/Rustycord"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
