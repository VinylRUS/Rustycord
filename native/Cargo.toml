[package]
name = "rustycord-native"
version = "0.1.0"
edition = "2021"
description = "RustyCord Native — GPUI-интерфейс (спайк-ветка gpui-spike, не продукт)"

[dependencies]
# 0.2.2 — опубликована 30.10.2026, синхронизирована с zed-индустриз.
# Пока НЕ git-зависимость: у крейта регулярные релизы на crates.io.
gpui = "0.2.2"
# Дерево GPUI тянет zed-async-tar 0.5.0-zed → xattr 0.2.3, который читает
# libc::ENOATTR. В свежих libc константу УДАЛИЛИ для linux (вынесли в крейт
# errno); на libc 0.2.191 xattr 0.2.3 не компилится (E0425). Пиним последний
# известный рабочий libc — как в lock-файле самого Zed (ENOATTR для linux_like
# ещё есть в 0.2.186, в 0.2.191 уже нет).
libc = "=0.2.186"

# GPUI тяжеловат в debug-сборке (GPU-обход кадров) — лёгкая оптимизация
# делает dev-окно отзывчивым без ущерба времени инкрементальной сборки.
[profile.dev]
opt-level = 1

[[bin]]
name = "rustycord-native"
path = "src/main.rs"
